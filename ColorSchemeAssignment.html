<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Scheme Assignment</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center;">

  <table style="width: 80%; margin: 20px auto; border-collapse: collapse;">
    <!-- Row 1: Scheme Name Header with custom font styles -->
    <tr>
      <th colspan="4" style="font-family: Georgia, serif; font-size: 26px; font-weight: bold; padding: 15px; border: 1px solid #333; background: #f0f0f0;">
        Sunset Beach
      </th>
    </tr>

    <!-- Row 2: Color Names with matching background colors -->
    <tr>
      <td style="background-color: #FF5E5B; color: white; padding: 12px; border: 1px solid #333;">Coral Red</td>
      <td style="background-color: #FF9F1C; color: black; padding: 12px; border: 1px solid #333;">Warm Amber</td>
      <td style="background-color: #FFBF69; color: black; padding: 12px; border: 1px solid #333;">Sandy Gold</td>
      <td style="background-color: #2EC4B6; color: white; padding: 12px; border: 1px solid #333;">Ocean Teal</td>
    </tr>

    <!-- Row 3: Hex Values -->
    <tr>
      <td style="padding: 10px; border: 1px solid #333;">#FF5E5B</td>
      <td style="padding: 10px; border: 1px solid #333;">#FF9F1C</td>
      <td style="padding: 10px; border: 1px solid #333;">#FFBF69</td>
      <td style="padding: 10px; border: 1px solid #333;">#2EC4B6</td>
    </tr>

    <!-- Row 4: RGB Values -->
    <tr>
      <td style="padding: 10px; border: 1px solid #333;">rgb(255, 94, 91)</td>
      <td style="padding: 10px; border: 1px solid #333;">rgb(255, 159, 28)</td>
      <td style="padding: 10px; border: 1px solid #333;">rgb(255, 191, 105)</td>
      <td style="padding: 10px; border: 1px solid #333;">rgb(46, 196, 182)</td>
    </tr>

    <!-- Row 5: HSL Values -->
    <tr>
      <td style="padding: 10px; border: 1px solid #333;">hsl(1, 100%, 68%)</td>
      <td style="padding: 10px; border: 1px solid #333;">hsl(35, 100%, 55%)</td>
      <td style="padding: 10px; border: 1px solid #333;">hsl(35, 100%, 71%)</td>
      <td style="padding: 10px; border: 1px solid #333;">hsl(174, 62%, 47%)</td>
    </tr>
  </table>

</body>
</html>
